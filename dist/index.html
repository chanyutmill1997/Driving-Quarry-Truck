  <script>
/**
 * โมดูลกล้องถ่ายรูปและระบบตรวจจับพิกัด GPS (Camera & Watermark Engine)
 * รองรับทั้ง: 1) In-App Live Camera Viewfinder (กล้องสดบนหน้าจอ)
 *             2) Native Camera Capture (Fallback)
 * ทำงานได้ 100% บนมือถือ iOS Safari และ Android Chrome
 */
class CameraEngine {
  constructor() {
    this.currentPosition = null;
    this.mediaStream = null;
  }

  // ขอพิกัดจากโทรศัพท์เฉพาะตอนถ่ายรูป ไม่มีการติดตามตำแหน่งต่อเนื่อง
  async getFreshGPS() {
    return new Promise((resolve) => {
      if (!("geolocation" in navigator)) {
        resolve({ lat: null, lng: null, accuracy: null, isAvailable: false });
        return;
      }

      navigator.geolocation.getCurrentPosition(
        pos => {
          this.currentPosition = pos.coords;
          resolve({
            lat: Number(pos.coords.latitude.toFixed(6)),
            lng: Number(pos.coords.longitude.toFixed(6)),
            accuracy: Math.round(pos.coords.accuracy || 5),
            timestamp: new Date().toISOString(),
            isAvailable: true
          });
        },
        err => {
          console.warn("GPS fallback used:", err.message);
          resolve({ lat: null, lng: null, accuracy: null, timestamp: new Date().toISOString(), isAvailable: false });
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    });
  }

  /**
   * เปิดกล้องถ่ายภาพพร้อมสแตมป์พิกัด
   * รองรับทั้ง In-App Viewfinder และ Direct File Capture
   */
  async captureWithWatermark(metadata = {}) {
    // พยายามเปิด In-App Live Camera Viewfinder ก่อนเพื่อความราบรื่น
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      try {
        return await this.openLiveCameraModal(metadata);
      } catch (e) {
        console.warn("Live camera modal failed, switching to native camera fallback:", e);
      }
    }

    // Fallback: ใช้ Native Camera Capture แบบ Synchronous ทันที (ไม่ติดบล็อก Safari)
    return this.openNativeFileCamera(metadata);
  }

  // -------------------------------------------------------------
  // 1. In-App Live Camera Viewfinder (กล้องสดแบบแสดงวิดีโอบนจอ)
  // -------------------------------------------------------------
  openLiveCameraModal(metadata) {
    return new Promise(async (resolve, reject) => {
      // สร้าง Modal กล้องแบบ Fullscreen
      let modal = document.getElementById('in-app-camera-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'in-app-camera-modal';
        document.body.appendChild(modal);
      }

      modal.className = "fixed inset-0 z-50 bg-black flex flex-col justify-between text-white select-none";
      modal.innerHTML = `
        <!-- Top Bar -->
        <div class="p-4 bg-gradient-to-b from-black/80 to-transparent flex items-center justify-between z-10">
          <div>
            <span class="text-xs font-black text-blue-400 uppercase tracking-wider">
              ${metadata.stepType === 'load' ? '📍 จุดรับหิน' : (metadata.stepType === 'dump' ? '🏁 จุดเทหิน' : '🚜 ตักหิน')}
            </span>
            <p class="text-xs text-slate-300 font-bold">${metadata.vehicleCode || ''} • ${metadata.driverName || ''}</p>
          </div>
          <button id="close-cam-btn" class="w-10 h-10 rounded-full bg-slate-800/80 text-white font-bold flex items-center justify-center text-lg">✕</button>
        </div>

        <!-- Video Viewfinder -->
        <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
          <video id="cam-video-feed" autoplay playsinline class="w-full h-full object-cover"></video>
          
          <!-- Live Watermark Overlay Tag -->
          <div class="absolute bottom-4 left-4 right-4 bg-slate-950/80 backdrop-blur-sm border border-slate-700/80 rounded-2xl p-3 text-xs space-y-1">
            <div class="flex items-center justify-between text-blue-400 font-bold">
              <span>🕒 กำลังจับเวลาสด...</span>
              <span id="cam-gps-live" class="text-emerald-400 font-mono">📍 GPS กำลังจับสัญญาณ...</span>
            </div>
            <p class="text-slate-300 text-[11px]">${metadata.jobName || ''}</p>
          </div>
        </div>

        <!-- Bottom Shutter Control Bar -->
        <div class="p-6 bg-gradient-to-t from-black/90 to-transparent flex items-center justify-around z-10">
          <button id="cam-fallback-btn" class="text-xs text-slate-400 bg-slate-800/60 px-3 py-2 rounded-xl font-bold">
            📷 ใช้กล้องเครื่อง
          </button>
          
          <!-- Big Shutter Button -->
          <button id="cam-shutter-btn" class="w-20 h-20 rounded-full bg-white border-4 border-blue-500 shadow-2xl flex items-center justify-center active:scale-90 transition-transform">
            <div class="w-16 h-16 rounded-full bg-blue-500 flex items-center justify-center">
              <span class="text-2xl">📸</span>
            </div>
          </button>

          <div class="w-20 text-center">
            <span class="text-[10px] text-slate-400 font-bold">แตะเพื่อถ่าย</span>
          </div>
        </div>
      `;

      modal.style.display = 'flex';

      // เริ่มสตรีมวิดีโอจากกล้องหลัง
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1280 },
            height: { ideal: 960 }
          },
          audio: false
        });

        this.mediaStream = stream;
        const video = document.getElementById('cam-video-feed');
        if (video) {
          video.srcObject = stream;
          video.play();
        }
      } catch (err) {
        this.closeLiveCameraModal();
        // ถ้าเปิด video stream ไม่ได้ ให้สลับไปใช้ native camera
        resolve(this.openNativeFileCamera(metadata));
        return;
      }

      // ดึง GPS คู่ขนาน
      let liveGps = await this.getFreshGPS();
      const gpsLabel = document.getElementById('cam-gps-live');
      if (gpsLabel) gpsLabel.innerText = liveGps.isAvailable ? `📍 ${liveGps.lat}, ${liveGps.lng}` : '📍 กรุณาอนุญาตตำแหน่ง';

      // ปุ่มปิด
      document.getElementById('close-cam-btn').onclick = () => {
        this.closeLiveCameraModal();
        reject(new Error("ยกเลิกการถ่ายรูป"));
      };

      // ปุ่มสลับเป็นกล้องเครื่อง
      document.getElementById('cam-fallback-btn').onclick = () => {
        this.closeLiveCameraModal();
        resolve(this.openNativeFileCamera(metadata));
      };

      // ปุ่มชัตเตอร์ถ่ายภาพ
      document.getElementById('cam-shutter-btn').onclick = async () => {
        const video = document.getElementById('cam-video-feed');
        if (!video) return;

        // วาดภาพจาก Video Feed ลง Canvas
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 960;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        this.closeLiveCameraModal();

        // ปั๊มลายน้ำ Watermark
        const freshGps = await this.getFreshGPS();
        const watermarked = this.drawWatermarkOnCanvas(canvas, metadata, freshGps);

        resolve({
          photoBase64: watermarked,
          gps: freshGps,
          timestamp: new Date().toLocaleString('th-TH')
        });
      };
    });
  }

  closeLiveCameraModal() {
    if (this.mediaStream) {
      this.mediaStream.getTracks().forEach(track => track.stop());
      this.mediaStream = null;
    }
    const modal = document.getElementById('in-app-camera-modal');
    if (modal) {
      modal.style.display = 'none';
      modal.innerHTML = '';
    }
  }

  // -------------------------------------------------------------
  // 2. Native Camera Fallback (เปิดกล้องระบบมือถือโดยตรง)
  // -------------------------------------------------------------
  openNativeFileCamera(metadata) {
    return new Promise((resolve, reject) => {
      // สร้าง input แนบใน DOM ชั่วคราวเพื่อให้ Safari ยอมรับ click event
      let input = document.getElementById('temp-camera-input');
      if (!input) {
        input = document.createElement('input');
        input.id = 'temp-camera-input';
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'environment';
        input.style.display = 'none';
        document.body.appendChild(input);
      }

      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) {
          reject(new Error("ไม่ได้ถ่ายรูป"));
          return;
        }

        try {
          const img = await this.loadImageFromFile(file);
          const gps = await this.getFreshGPS();
          const watermarkedBase64 = this.applyWatermark(img, metadata, gps);
          resolve({
            photoBase64: watermarkedBase64,
            gps: gps,
            timestamp: new Date().toLocaleString('th-TH')
          });
        } catch (err) {
          reject(err);
        } finally {
          input.value = '';
        }
      };

      input.oncancel = () => {
        reject(new Error("ยกเลิกการถ่ายรูป"));
      };

      // กดเปิดกล้องทันที
      input.click();
    });
  }

  loadImageFromFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  applyWatermark(img, metadata, gps) {
    const canvas = document.createElement('canvas');
    const MAX_WIDTH = 960;
    const scale = Math.min(1, MAX_WIDTH / img.width);
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);

    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    return this.drawWatermarkOnCanvas(canvas, metadata, gps);
  }

  drawWatermarkOnCanvas(canvas, metadata, gps) {
    const ctx = canvas.getContext('2d');
    const bannerHeight = Math.max(140, canvas.height * 0.22);
    const bannerY = canvas.height - bannerHeight;

    // แถบสีดำโปร่งแสงด้านล่าง
    ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    ctx.fillRect(0, bannerY, canvas.width, bannerHeight);

    // เส้นขอบสีส้ม/เหลือง
    ctx.fillStyle = '#2563eb';
    ctx.fillRect(0, bannerY, canvas.width, 6);

    const baseFontSize = Math.max(18, Math.round(canvas.width * 0.024));
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffffff';

    const nowStr = new Date().toLocaleString('th-TH', { 
      year: 'numeric', month: 'short', day: 'numeric', 
      hour: '2-digit', minute: '2-digit', second: '2-digit' 
    });

    const stepLabel = metadata.stepType === 'load' ? '📍 [จุดรับหิน / ขึ้นของ]' : 
                     (metadata.stepType === 'dump' ? '🏁 [จุดเทหิน / ส่งมอบ]' : '🚜 [ตักหินแม็คโคร]');
    
    const badgeColor = metadata.stepType === 'load' ? '#3b82f6' : 
                      (metadata.stepType === 'dump' ? '#10b981' : '#2563eb');

    // บรรทัดที่ 1: สถานะและเวลา
    ctx.font = `bold ${baseFontSize * 1.3}px 'Sarabun', -apple-system, sans-serif`;
    ctx.fillStyle = badgeColor;
    ctx.fillText(stepLabel, 20, bannerY + (bannerHeight * 0.22));

    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${baseFontSize * 1.05}px 'Sarabun', -apple-system, sans-serif`;
    ctx.fillText(`🕒 ${nowStr}`, canvas.width - (baseFontSize * 16), bannerY + (bannerHeight * 0.22));

    // บรรทัดที่ 2: ข้อมูลรถ และ คนขับ
    ctx.font = `${baseFontSize * 1.05}px 'Sarabun', -apple-system, sans-serif`;
    ctx.fillStyle = '#fde047';
    const vehicleText = `🚚 รถ: ${metadata.vehicleCode || '-'} ${metadata.capacity ? '(' + metadata.capacity + ' ตัน)' : ''}`;
    const driverText = `👤 คนขับ: ${metadata.driverName || '-'}`;
    ctx.fillText(`${vehicleText}  |  ${driverText}`, 20, bannerY + (bannerHeight * 0.52));

    // บรรทัดที่ 3: รอบที่, ประเภทงาน และ พิกัด GPS
    ctx.fillStyle = '#cbd5e1';
    ctx.font = `${baseFontSize * 0.95}px 'Sarabun', -apple-system, sans-serif`;
    const roundText = metadata.roundNumber ? `รอบที่ ${metadata.roundNumber}` : '';
    const jobText = metadata.jobName ? ` [${metadata.jobName}]` : '';
    const gpsText = gps && gps.isAvailable
      ? `🌐 พิกัดโทรศัพท์: ${gps.lat}, ${gps.lng} (±${gps.accuracy}m)`
      : '🌐 พิกัดโทรศัพท์: ไม่ได้รับอนุญาต/ไม่พบสัญญาณ';
    ctx.fillText(`${roundText}${jobText}  •  ${gpsText}`, 20, bannerY + (bannerHeight * 0.82));

    return canvas.toDataURL('image/jpeg', 0.72);
  }
}

window.cameraEngine = new CameraEngine();

</script>
  <script>
/**
 * ศูนย์กลางจัดการข้อมูลและฐานข้อมูล Local + Cloud Sync (Store & State Management)
 */
class QuarryStore {
  constructor() {
    this.masterData = null;
    this.trips = [];
    this.excavatorLogs = [];
    this.pendingSyncQueue = [];
    this.listeners = [];
    this.isSyncing = false;
    this.cloudStatus = 'unknown';
    this.lastSyncAt = null;
    this.lastSyncError = null;
  }

  async init() {
    // 1. โหลด Master Data จาก LocalStorage หรือ seed_data.json
    const cachedMaster = localStorage.getItem(CONFIG.STORAGE_KEYS.MASTER_DATA);
    if (cachedMaster) {
      try {
        this.masterData = JSON.parse(cachedMaster);
      } catch (e) {
        console.error("Failed to parse cached master data", e);
      }
    }

    if (!this.masterData && window.EMBEDDED_SEED_DATA) {
      this.masterData = window.EMBEDDED_SEED_DATA;
      this.saveMasterData();
    }

    if (!this.masterData) {
      try {
        const resp = await fetch('data/seed_data.json');
        this.masterData = await resp.json();
        this.saveMasterData();
      } catch (err) {
        console.warn("Could not fetch seed_data.json, using fallback blank structure", err);
        this.masterData = { trucks: [], excavators: [], drivers: [], job_rates: [] };
      }
    }

    // 2. โหลดรายการ Trips และ Excavator Logs
    this.trips = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.TRIPS) || '[]').map(trip => {
      const { loadPhotoBase64, dumpPhotoBase64, ...cleanTrip } = trip;
      return cleanTrip;
    });
    // ปรับยอดเดิมในเครื่องให้เป็นเรทต่อตัน × พิกัดรถ
    this.trips = this.trips.map(trip => ({
      ...trip,
      amount: this.calculateTruckRate(trip.jobTypeId, Number(trip.capacityTon) || 0)
    }));
    // ล้างเฉพาะรูปเต็มที่เวอร์ชันเก่าเคยเก็บซ้ำในประวัติ ไม่ลบข้อมูลเที่ยว
    try { localStorage.setItem(CONFIG.STORAGE_KEYS.TRIPS, JSON.stringify(this.trips)); } catch (e) { console.warn('Trip history cleanup deferred:', e.message); }
    this.excavatorLogs = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.EXCAVATOR_LOGS) || '[]');
    this.pendingSyncQueue = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.PENDING_SYNC) || '[]');

    // แสดงหน้าจอจาก cache ทันที แล้วค่อยอัปเดตข้อมูล Cloud เบื้องหลัง
    this.refreshMasterDataFromCloud().then(() => this.notify());

    // 3. เริ่มระบบ Auto Sync เบื้องหลัง
    setInterval(() => this.processSyncQueue(), CONFIG.AUTO_SYNC_INTERVAL_MS);
    window.addEventListener('online', () => {
      this.cloudStatus = 'connecting';
      this.processSyncQueue();
    });
    window.addEventListener('offline', () => {
      this.cloudStatus = 'offline';
      this.notify();
    });
    // เริ่มซิงก์ในรอบถัดไป เพื่อไม่ให้การแจ้งสถานะของ Cloud แทรกระหว่าง
    // การรีเซ็ตหน้าจอคนขับหลังปิดงานรอบหนึ่ง
    setTimeout(() => this.processSyncQueue(), 0);
    this.notify();
  }

  async apiRequest(payload, timeoutMs = CONFIG.API_TIMEOUT_MS) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ ...payload, appVersion: CONFIG.VERSION }),
        signal: controller.signal,
        redirect: 'follow'
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const result = await response.json();
      if (!result || result.status !== 'success') {
        throw new Error(result && result.message ? result.message : 'Cloud API error');
      }
      this.cloudStatus = 'online';
      this.lastSyncError = null;
      return result;
    } finally {
      clearTimeout(timer);
    }
  }

  async refreshMasterDataFromCloud() {
    if (!navigator.onLine || !CONFIG.API_URL) {
      this.cloudStatus = 'offline';
      return false;
    }
    try {
      this.cloudStatus = 'connecting';
      const result = await this.apiRequest({ action: 'getMasterData' });
      if (result.data && Array.isArray(result.data.trucks) && result.data.trucks.length) {
        const cached = this.masterData || {};
        const validTrucks = result.data.trucks.filter(x => x.id && x.code && Number(x.capacity_ton) > 0);
        const validExcavators = result.data.excavators.filter(x => x.id && x.code);
        const validDrivers = result.data.drivers.filter(x => x.id && x.name && x.role);
        const validRates = result.data.job_rates.filter(x => x.id && x.name);
        this.masterData = {
          trucks: validTrucks.length ? validTrucks : (cached.trucks || []),
          excavators: validExcavators.length ? validExcavators : (cached.excavators || []),
          drivers: validDrivers.length ? validDrivers : (cached.drivers || []),
          job_rates: validRates.length ? validRates : (cached.job_rates || [])
        };
        localStorage.setItem(CONFIG.STORAGE_KEYS.MASTER_DATA, JSON.stringify(this.masterData));
      }
      this.lastSyncAt = new Date().toISOString();
      return true;
    } catch (error) {
      this.cloudStatus = navigator.onLine ? 'error' : 'offline';
      this.lastSyncError = error.name === 'AbortError' ? 'หมดเวลารอระบบกลาง' : error.message;
      console.warn('Using cached master data:', this.lastSyncError);
      return false;
    }
  }

  // Subscribe state changes
  subscribe(fn) {
    this.listeners.push(fn);
    return () => {
      this.listeners = this.listeners.filter(l => l !== fn);
    };
  }

  notify() {
    this.listeners.forEach(fn => fn(this));
  }

  // -------------------------------------------------------------
  // Master Data Methods
  // -------------------------------------------------------------
  saveMasterData() {
    localStorage.setItem(CONFIG.STORAGE_KEYS.MASTER_DATA, JSON.stringify(this.masterData));
    this.notify();
  }

  getTrucks() {
    return this.masterData ? this.masterData.trucks || [] : [];
  }

  getExcavators() {
    return this.masterData ? this.masterData.excavators || [] : [];
  }

  getDrivers() {
    return this.masterData ? this.masterData.drivers || [] : [];
  }

  getJobRates() {
    return this.masterData ? this.masterData.job_rates || [] : [];
  }

  // คำนวณราคาเที่ยวสำหรับรถบรรทุก
  calculateTruckRate(jobRateId, capacityTon) {
    const rates = this.getJobRates();
    const job = rates.find(r => r.id === jobRateId);
    if (!job) return 0;

    const ratePerTon = capacityTon >= 60
      ? (job.rate_60_ton || 0)
      : (capacityTon >= 45 ? (job.rate_45_ton || 0) : (job.rate_30_ton || 0));
    return ratePerTon * capacityTon;
  }

  // -------------------------------------------------------------
  // Truck Trips Methods
  // -------------------------------------------------------------
  saveTrip(tripData) {
    // รูปเต็มเก็บเฉพาะในคิวส่ง Cloud ไม่เก็บซ้ำในประวัติ LocalStorage
    const { loadPhotoBase64, dumpPhotoBase64, ...localTrip } = tripData;
    const existingIndex = this.trips.findIndex(t => t.id === localTrip.id);
    if (existingIndex >= 0) {
      this.trips[existingIndex] = { ...this.trips[existingIndex], ...localTrip };
    } else {
      this.trips.unshift(localTrip);
    }

    try {
      localStorage.setItem(CONFIG.STORAGE_KEYS.TRIPS, JSON.stringify(this.trips));
    } catch (err) {
      // เก็บประวัติล่าสุดก่อน หากเครื่องมีข้อมูลเก่าจนพื้นที่เต็ม
      this.trips = this.trips.slice(0, 200);
      localStorage.setItem(CONFIG.STORAGE_KEYS.TRIPS, JSON.stringify(this.trips));
    }
    
    // เพิ่มเข้าคิวซิงค์ขึ้น Cloud
    this.queueSync('saveTrip', tripData);
    this.notify();
    return tripData;
  }

  getTrips(filter = {}) {
    let result = [...this.trips];
    if (filter.driverPhone) {
      result = result.filter(t => t.driverPhone === filter.driverPhone);
    }
    if (filter.truckPlate) {
      result = result.filter(t => t.truckPlate === filter.truckPlate);
    }
    if (filter.date) {
      result = result.filter(t => t.date === filter.date);
    }
    return result;
  }

  // -------------------------------------------------------------
  // Excavator Logs Methods
  // -------------------------------------------------------------
  saveExcavatorLog(logData) {
    const existingIndex = this.excavatorLogs.findIndex(l => l.id === logData.id);
    if (existingIndex >= 0) {
      this.excavatorLogs[existingIndex] = { ...this.excavatorLogs[existingIndex], ...logData };
    } else {
      this.excavatorLogs.unshift(logData);
    }

    localStorage.setItem(CONFIG.STORAGE_KEYS.EXCAVATOR_LOGS, JSON.stringify(this.excavatorLogs));
    
    // เพิ่มเข้าคิวซิงค์ขึ้น Cloud
    this.queueSync('saveExcavatorLog', logData);
    this.notify();
    return logData;
  }

  getExcavatorLogs(filter = {}) {
    let result = [...this.excavatorLogs];
    if (filter.operatorName) {
      result = result.filter(l => l.operatorName === filter.operatorName);
    }
    if (filter.excavatorCode) {
      result = result.filter(l => l.excavatorCode === filter.excavatorCode);
    }
    if (filter.date) {
      result = result.filter(l => l.date === filter.date);
    }
    return result;
  }

  // -------------------------------------------------------------
  // Cloud Sync Queue
  // -------------------------------------------------------------
  queueSync(action, payload) {
    this.pendingSyncQueue.push({
      id: 'SYNC_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
      action: action,
      payload: payload,
      createdAt: new Date().toISOString(),
      attempts: 0,
      lastError: null
    });
    try {
      localStorage.setItem(CONFIG.STORAGE_KEYS.PENDING_SYNC, JSON.stringify(this.pendingSyncQueue));
    } catch (err) {
      // รูปยังอยู่ในหน่วยความจำและจะส่งทันทีเมื่อออนไลน์ แม้พื้นที่ถาวรของเบราว์เซอร์เต็ม
      console.warn('Pending photo queue kept in memory:', err.message);
    }
    this.processSyncQueue();
  }

  async processSyncQueue() {
    if (this.isSyncing || this.pendingSyncQueue.length === 0 || !navigator.onLine) return;
    this.isSyncing = true;
    this.notify();

    try {
      while (this.pendingSyncQueue.length > 0) {
        const item = this.pendingSyncQueue[0];
        const bodyData = {
          action: item.action,
          ...item.payload
        };
        item.attempts = (item.attempts || 0) + 1;
        const resJson = await this.apiRequest(bodyData);
        // Backend คำนวณยอดใหม่เสมอ จึงอัปเดต local record ให้ตรงกับ Cloud
        if (item.action === 'saveTrip' && typeof resJson.amount === 'number') {
          const trip = this.trips.find(t => t.id === item.payload.id);
          if (trip) trip.amount = resJson.amount;
          localStorage.setItem(CONFIG.STORAGE_KEYS.TRIPS, JSON.stringify(this.trips));
        }
        if (item.action === 'saveExcavatorLog' && typeof resJson.amount === 'number') {
          const log = this.excavatorLogs.find(l => l.id === item.payload.id);
          if (log) log.amount = resJson.amount;
          localStorage.setItem(CONFIG.STORAGE_KEYS.EXCAVATOR_LOGS, JSON.stringify(this.excavatorLogs));
        }
        this.pendingSyncQueue.shift();
        this.lastSyncAt = new Date().toISOString();
        localStorage.setItem(CONFIG.STORAGE_KEYS.PENDING_SYNC, JSON.stringify(this.pendingSyncQueue));
      }
    } catch (e) {
      const item = this.pendingSyncQueue[0];
      if (item) {
        item.lastError = e.name === 'AbortError' ? 'หมดเวลารอระบบกลาง' : e.message;
        localStorage.setItem(CONFIG.STORAGE_KEYS.PENDING_SYNC, JSON.stringify(this.pendingSyncQueue));
      }
      this.cloudStatus = navigator.onLine ? 'error' : 'offline';
      this.lastSyncError = item ? item.lastError : e.message;
      console.warn("Cloud sync error; queue retained:", this.lastSyncError);
    } finally {
      this.isSyncing = false;
      this.notify();
    }
  }

  getSyncStatus() {
    return {
      status: this.cloudStatus,
      pending: this.pendingSyncQueue.length,
      lastSyncAt: this.lastSyncAt,
      lastError: this.lastSyncError,
      needsAttention: this.pendingSyncQueue.some(x => (x.attempts || 0) >= CONFIG.MAX_SYNC_ATTEMPTS_BEFORE_WARNING)
    };
  }

  // -------------------------------------------------------------
  // Master Data CRUD Actions
  // -------------------------------------------------------------
  addOrUpdateTruck(truck) {
    if (!this.masterData.trucks) this.masterData.trucks = [];
    const idx = this.masterData.trucks.findIndex(t => t.id === truck.id);
    if (idx >= 0) {
      this.masterData.trucks[idx] = { ...this.masterData.trucks[idx], ...truck };
    } else {
      this.masterData.trucks.push(truck);
    }
    this.saveMasterData();
  }

  deleteTruck(truckId) {
    if (!this.masterData.trucks) return;
    this.masterData.trucks = this.masterData.trucks.filter(t => t.id !== truckId);
    this.saveMasterData();
  }

  addOrUpdateExcavator(exc) {
    if (!this.masterData.excavators) this.masterData.excavators = [];
    const idx = this.masterData.excavators.findIndex(e => e.id === exc.id);
    if (idx >= 0) {
      this.masterData.excavators[idx] = { ...this.masterData.excavators[idx], ...exc };
    } else {
      this.masterData.excavators.push(exc);
    }
    this.saveMasterData();
  }

  deleteExcavator(excId) {
    if (!this.masterData.excavators) return;
    this.masterData.excavators = this.masterData.excavators.filter(e => e.id !== excId);
    this.saveMasterData();
  }

  addOrUpdateJobRate(rate) {
    if (!this.masterData.job_rates) this.masterData.job_rates = [];
    const idx = this.masterData.job_rates.findIndex(r => r.id === rate.id);
    if (idx >= 0) {
      this.masterData.job_rates[idx] = { ...this.masterData.job_rates[idx], ...rate };
    } else {
      this.masterData.job_rates.push(rate);
    }
    this.saveMasterData();
  }

  deleteJobRate(rateId) {
    if (!this.masterData.job_rates) return;
    this.masterData.job_rates = this.masterData.job_rates.filter(r => r.id !== rateId);
    this.saveMasterData();
  }

  addOrUpdateDriver(driver) {
    if (!this.masterData.drivers) this.masterData.drivers = [];
    const idx = this.masterData.drivers.findIndex(d => d.id === driver.id);
    if (idx >= 0) {
      this.masterData.drivers[idx] = { ...this.masterData.drivers[idx], ...driver };
    } else {
      this.masterData.drivers.push(driver);
    }
    this.saveMasterData();
  }

  deleteDriver(driverId) {
    if (!this.masterData.drivers) return;
    this.masterData.drivers = this.masterData.drivers.filter(d => d.id !== driverId);
    this.saveMasterData();
  }

  // รีเซ็ตข้อมูลกลับเป็นค่าเริ่มต้นจากไฟล์ Excel
  async resetToSeedData() {
    try {
      const resp = await fetch('data/seed_data.json');
      this.masterData = await resp.json();
      this.saveMasterData();
      return true;
    } catch (e) {
      console.error(e);
      return false;
    }
  }
}

window.quarryStore = new QuarryStore();

/**
 * โมดูลยืนยันตัวตนและการจัดการสิทธิ์ (Authentication & Role Management)
 */
class AuthService {
  constructor() {
    this.currentUser = null;
    this.currentShift = null;
    this.workMode = localStorage.getItem(CONFIG.STORAGE_KEYS.CURRENT_WORK_MODE) || null;
    this.loadSession();
  }

  loadSession() {
    try {
      const userJson = localStorage.getItem(CONFIG.STORAGE_KEYS.CURRENT_USER);
      if (userJson) this.currentUser = JSON.parse(userJson);

      const shiftJson = localStorage.getItem(CONFIG.STORAGE_KEYS.CURRENT_SHIFT);
      if (shiftJson) this.currentShift = JSON.parse(shiftJson);
    } catch (e) {
      console.error("Auth session load error", e);
    }
  }

  isLoggedIn() {
    return !!this.currentUser;
  }

  getUser() {
    return this.currentUser;
  }

  getRole() {
    return this.currentUser ? this.currentUser.role : null;
  }

  getShift() {
    return this.currentShift;
  }

  // เข้าสู่ระบบด้วย เบอร์โทร/ชื่อ และ PIN
  async login(identifier, pin, selectedRole = 'driver') {
    try {
      const result = await window.quarryStore.apiRequest({ action: 'login', identifier, pin }, 30000);
      this.currentUser = result.user;
      const actualRole = this.currentUser.role;
      const roleMatches = selectedRole === 'driver'
        ? ['truck_driver', 'excavator_operator'].includes(actualRole)
        : actualRole === selectedRole;
      if (!roleMatches) {
        this.currentUser = null;
        return { success: false, message: 'บัญชีนี้ไม่ตรงกับประเภทผู้ใช้งานที่เลือก' };
      }
      this.workMode = selectedRole === 'driver' ? null : actualRole;
      localStorage.removeItem(CONFIG.STORAGE_KEYS.CURRENT_WORK_MODE);
      localStorage.setItem(CONFIG.STORAGE_KEYS.CURRENT_USER, JSON.stringify(this.currentUser));
      return { success: true, user: this.currentUser };
    } catch (error) {
      return { success: false, message: error.message || 'เข้าสู่ระบบไม่สำเร็จ' };
    }
  }

  getWorkMode() { return this.workMode; }

  selectWorkMode(mode) {
    if (!['truck_driver', 'excavator_operator'].includes(mode)) return false;
    this.workMode = mode;
    localStorage.setItem(CONFIG.STORAGE_KEYS.CURRENT_WORK_MODE, mode);
    return true;
  }

  // Quick Login สำหรับทดสอบหน้างาน
  quickLoginAs(role) {
    const drivers = window.quarryStore.getDrivers();
    let target = null;
    if (role === 'admin') {
      target = drivers.find(d => d.role === 'admin') || { id: 'ADMIN_1', name: 'ผู้บริหารโรงโม่', role: 'admin' };
    } else if (role === 'supervisor') {
      target = drivers.find(d => d.role === 'supervisor') || { id: 'SUP_1', name: 'หัวหน้างานหน้างาน', role: 'supervisor' };
    } else if (role === 'excavator_operator') {
      target = drivers.find(d => d.role === 'excavator_operator') || drivers[drivers.length - 2];
    } else {
      // truck driver
      target = drivers.find(d => d.role === 'truck_driver') || drivers[0];
    }

    this.currentUser = target;
    localStorage.setItem(CONFIG.STORAGE_KEYS.CURRENT_USER, JSON.stringify(this.currentUser));
    return this.currentUser;
  }

  // เปิดกะประจำวัน (เลือกรถที่ขับในวันนั้น)
  startShift(vehicleCode, capacityTon = 30) {
    this.currentShift = {
      shiftId: 'SHIFT_' + Date.now(),
      driverId: this.currentUser.id,
      driverName: this.currentUser.name,
      driverPhone: this.currentUser.phone,
      vehicleCode: vehicleCode,
      capacityTon: capacityTon,
      startedAt: new Date().toISOString(),
      date: new Date().toISOString().split('T')[0]
    };
    localStorage.setItem(CONFIG.STORAGE_KEYS.CURRENT_SHIFT, JSON.stringify(this.currentShift));
    window.quarryStore.queueSync('startShift', {
      ...this.currentShift,
      userId: this.currentUser.id,
      userName: this.currentUser.name,
      role: this.currentUser.role,
      appVersion: CONFIG.VERSION
    });
    return this.currentShift;
  }

  // ปิดกะประจำวัน
  endShift() {
    if (this.currentShift) {
      window.quarryStore.queueSync('endShift', {
        shiftId: this.currentShift.shiftId,
        driverName: this.currentUser ? this.currentUser.name : this.currentShift.driverName,
        endedAt: new Date().toISOString(),
        appVersion: CONFIG.VERSION
      });
    }
    this.currentShift = null;
    localStorage.removeItem(CONFIG.STORAGE_KEYS.CURRENT_SHIFT);
  }

  logout() {
    this.currentUser = null;
    this.currentShift = null;
    this.workMode = null;
    localStorage.removeItem(CONFIG.STORAGE_KEYS.CURRENT_USER);
    localStorage.removeItem(CONFIG.STORAGE_KEYS.CURRENT_SHIFT);
    localStorage.removeItem(CONFIG.STORAGE_KEYS.CURRENT_WORK_MODE);
  }
}

window.authService = new AuthService();

  <script>
/**
 * ระบบ AI ตรวจจับความผิดปกติ และ AI ผู้ช่วยอัจฉริยะ (Quarry AI Engine & Copilot)
 */
class QuarryAIEngine {
  constructor() {
    this.chatHistory = [
      {
        sender: 'ai',
        text: 'สวัสดีครับผู้บริหาร! ผมคือ AI ผู้ช่วยโรงโม่หิน สามารถสอบถามยอดสรุปประจำวัน, วิเคราะห์ความผิดปกติของรอบวิ่ง, ตรวจสอบสถานะรถ หรือคำนวณยอดเงินได้ทันทีครับ',
        time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
      }
    ];
  }

  // ------------------------------------------------------------------------
  // 1. ระบบตรวจจับความผิดปกติ (Anomaly Detection)
  // ------------------------------------------------------------------------
  detectAnomalies() {
    const trips = window.quarryStore.getTrips();
    const excLogs = window.quarryStore.getExcavatorLogs();
    const trucks = window.quarryStore.getTrucks();
    const today = new Date().toISOString().split('T')[0];
    const todayTrips = trips.filter(t => t.date === today);

    const anomalies = [];

    // กฎที่ 1: ตรวจจับรอบวิ่งเร็วเกินจริง (Impossible Fast Trip Duration)
    // ถ้ารอบวิ่งคนเดียวกันมีเวลาห่างกันน้อยกว่า 2 นาที
    for (let i = 0; i < todayTrips.length - 1; i++) {
      const current = todayTrips[i];
      const prev = todayTrips[i + 1];
      if (current.driverPhone === prev.driverPhone && current.truckPlate === prev.truckPlate) {
        // หากระยะเวลาใกล้เคียงกันมาก
        anomalies.push({
          id: 'ANO_' + current.id,
          type: 'speed',
          severity: 'warning',
          title: `รอบวิ่งเร็วผิดปกติ (ความถี่สูง)`,
          desc: `คนขับ ${current.driverName} (${current.truckPlate}) บันทึกรอบ #${current.roundNumber} ต่อจากรอบก่อนหน้าเร็วเกินเกณฑ์มาตรฐาน`,
          referenceId: current.id,
          vehicleCode: current.truckPlate,
          driverName: current.driverName,
          timestamp: current.timestamp,
          photoUrl: current.loadPhotoBase64,
          recommendedAction: 'ตรวจสอบรูปถ่ายจุดรับและจุดเทหินว่าถ่ายจากหน้างานจริงหรือไม่ หรือโทรสอบถามคนขับ'
        });
        break; // แจ้งเตือนตัวอย่าง
      }
    }

    // กฎที่ 2: ตรวจจับพิกัด GPS ซ้ำซ้อน หรือรับ-เทที่เดิม (GPS Inconsistency)
    todayTrips.forEach(t => {
      if (t.loadLat && t.dumpLat && t.loadLat === t.dumpLat && t.loadLng === t.dumpLng) {
        anomalies.push({
          id: 'ANO_GPS_' + t.id,
          type: 'gps',
          severity: 'critical',
          title: `พิกัดจุดรับและจุดเทเป็นตำแหน่งเดียวกัน`,
          desc: `รอบที่ #${t.roundNumber} ของรถ ${t.truckPlate} มีพิกัดรับหินและเทหินอยู่ที่เดียวกัน (${t.loadLat}, ${t.loadLng})`,
          referenceId: t.id,
          vehicleCode: t.truckPlate,
          driverName: t.driverName,
          timestamp: t.timestamp,
          photoUrl: t.dumpPhotoBase64 || t.loadPhotoBase64,
          recommendedAction: 'ตรวจสอบตำแหน่งบนแผนที่ว่าคนขับกดถ่ายรูปที่จุดรับทั้งสองครั้งหรือไม่'
        });
      }
    });

    // กฎที่ 3: ตรวจจับรถจอดไม่ได้วิ่งเกินเกณฑ์ (Fleet Idleness)
    const activePlates = new Set(todayTrips.map(t => t.truckPlate));
    const idleTrucks = trucks.filter(t => !activePlates.has(t.code));
    if (idleTrucks.length >= 8) {
      anomalies.push({
        id: 'ANO_FLEET_IDLE',
        type: 'fleet',
        severity: 'info',
        title: `มีรถบรรทุกจอดอยู่ ${idleTrucks.length} คัน (อัตราว่าง ${Math.round((idleTrucks.length / trucks.length) * 100)}%)`,
        desc: `พบรถสิบล้อจอดไม่ได้เปิดกะจำนวนมาก เช่น ${idleTrucks.slice(0, 4).map(t => t.code).join(', ')}`,
        referenceId: 'FLEET',
        vehicleCode: 'หลายคัน',
        driverName: 'ไม่ได้วิ่ง',
        timestamp: new Date().toLocaleTimeString('th-TH'),
        recommendedAction: 'ตรวจสอบคิวงาน หรือจัดสรรคนขับเสริมเพื่อเพิ่มกำลังการขนหิน'
      });
    }

    // กฎที่ 4: ตรวจสอบความสอดคล้องระหว่างสิบล้อกับแม็คโคร (Excavator-Truck Match)
    if (todayTrips.length > 0 && todayExcLogs.length === 0) {
      anomalies.push({
        id: 'ANO_EXC_GAP',
        type: 'match',
        severity: 'warning',
        title: `มีรอบวิ่งสิบล้อ ${todayTrips.length} รอบ แต่ยังไม่มีการบันทึกจากแม็คโคร`,
        desc: `สิบล้อเริ่มวิ่งงานแล้ว แต่ฝั่งคนขับแม็คโครยังไม่ได้เปิดกะบันทึกการตัก`,
        referenceId: 'EXCAVATOR',
        vehicleCode: 'แม็คโคร',
        driverName: 'แผนกขับรถขุด',
        timestamp: new Date().toLocaleTimeString('th-TH'),
        recommendedAction: 'แจ้งหัวหน้างานหน้างานเตือนคนขับแม็คโครให้เปิดระบบและกดบันทึกการตัก'
      });
    }

    return anomalies;
  }

  // ------------------------------------------------------------------------
  // 2. ระบบ AI ผู้ช่วยถามตอบอัจฉริยะ (AI Chatbot)
  // ------------------------------------------------------------------------
  ask(question) {
    const q = (question || '').trim().toLowerCase();
    const trips = window.quarryStore.getTrips();
    const excLogs = window.quarryStore.getExcavatorLogs();
    const trucks = window.quarryStore.getTrucks();
    const excavators = window.quarryStore.getExcavators();
    const drivers = window.quarryStore.getDrivers();
    const rates = window.quarryStore.getJobRates();

    const today = new Date().toISOString().split('T')[0];
    const todayTrips = trips.filter(t => t.date === today);
    const todayExcLogs = excLogs.filter(l => l.date === today);

    let answer = "";

    // 1. ถามยอดสรุปวันนี้
    if (q.includes('วันนี้') && (q.includes('กี่เที่ยว') || q.includes('ยอด') || q.includes('เท่าไหร่') || q.includes('สรุป'))) {
      const totalAmountTrucks = todayTrips.reduce((s, t) => s + (t.amount || 0), 0);
      const totalAmountExc = todayExcLogs.reduce((s, l) => s + (l.amount || 5), 0);
      const activeTrucks = new Set(todayTrips.map(t => t.truckPlate)).size;

      answer = `📊 **สรุปภาพรวมวันนี้ (${new Date().toLocaleDateString('th-TH')}):**\n` +
               `• 🚚 รถบรรทุกวิ่งงาน: **${activeTrucks} / ${trucks.length} คัน**\n` +
               `• 🏁 รอบวิ่งสำเร็จ: **${todayTrips.length} เที่ยว** (ยอดจ่าย: ฿${totalAmountTrucks.toLocaleString()} บาท)\n` +
               `• 🚜 แม็คโครตักหิน: **${todayExcLogs.length} คัน** (ยอดจ่าย: ฿${totalAmountExc.toLocaleString()} บาท)\n` +
               `• 💰 **ยอดจ่ายรวมทั้งสิ้นวันนี้: ฿${(totalAmountTrucks + totalAmountExc).toLocaleString()} บาท**`;
    }
    // 2. ถามว่าใครวิ่งเยอะสุด / ท็อป
    else if (q.includes('เยอะสุด') || q.includes('อันดับ') || q.includes('ท็อป') || q.includes('ใครวิ่ง')) {
      const countMap = {};
      todayTrips.forEach(t => {
        countMap[t.driverName] = (countMap[t.driverName] || 0) + 1;
      });
      const sorted = Object.entries(countMap).sort((a, b) => b[1] - a[1]);

      if (sorted.length === 0) {
        answer = 'วันนี้ยังไม่มีข้อมูลการวิ่งส่งเข้ามาครับ';
      } else {
        answer = `🏆 **อันดับคนขับที่วิ่งได้มากที่สุดวันนี้:**\n` +
                 sorted.slice(0, 5).map((item, idx) => `${idx + 1}. **${item[0]}**: ${item[1]} เที่ยว`).join('\n');
      }
    }
    // 3. ถามเรื่องรถจอด
    else if (q.includes('รถจอด') || q.includes('ไม่ได้วิ่ง') || q.includes('ว่าง')) {
      const activeTrucks = new Set(todayTrips.map(t => t.truckPlate));
      const idleTrucks = trucks.filter(t => !activeTrucks.has(t.code));
      answer = `🛑 **รถบรรทุกที่ยังไม่ได้วิ่งในวันนี้ (${idleTrucks.length} คัน):**\n` +
               idleTrucks.slice(0, 10).map(t => `• ${t.code} (${t.capacity_ton} ตัน) ${t.driver_name ? '- ' + t.driver_name : ''}`).join('\n') +
               (idleTrucks.length > 10 ? `\n...และอีก ${idleTrucks.length - 10} คัน` : '');
    }
    // 4. ถามเรื่องความผิดปกติ
    else if (q.includes('ผิดปกติ') || q.includes('โกง') || q.includes('เตือน') || q.includes('ปัญหา')) {
      const anomalies = this.detectAnomalies();
      if (anomalies.length === 0) {
        answer = '✅ **ผลการวิเคราะห์:** ไม่พบสิ่งผิดปกติในระบบ ข้อมูลพิกัด GPS และความถี่การวิ่งอยู่ในเกณฑ์ปกติครับ';
      } else {
        answer = `⚠️ **AI ตรวจพบข้อสังเกต ${anomalies.length} รายการ:**\n` +
                 anomalies.map((a, i) => `${i + 1}. **[${a.title}]**: ${a.desc}\n👉 *คำแนะนำ: ${a.recommendedAction}*`).join('\n\n');
      }
    }
    // 5. ถามเรื่องเรทราคา
    else if (q.includes('เรท') || q.includes('ราคา') || q.includes('ค่าเที่ยว')) {
      answer = `💰 **ตารางเรทราคาค่าเที่ยว (ตัวอย่าง):**\n` +
               rates.slice(0, 6).map(r => `• ${r.name}: 30t=฿${r.rate_30_ton || '-'}, 45t=฿${r.rate_45_ton || '-'}, 60t=฿${r.rate_60_ton || '-'}`).join('\n') +
               `\n*(สามารถปรับแก้ไขเรททั้งหมดได้ที่หน้า 'ตั้งค่าข้อมูลหลัก')*`;
    }
    // คำตอบทั่วไป / คำแนะนำ
    else {
      answer = `🤖 ผมสามารถตอบคำถามเกี่ยวกับ:\n` +
               `1. **"สรุปยอดวันนี้"** - ดูจำนวนเที่ยวและยอดเงินรวม\n` +
               `2. **"ใครวิ่งเยอะสุด"** - ดูอันดับคนขับดีเด่น\n` +
               `3. **"รถคันไหนจอดบ้าง"** - ตรวจสอบรถที่ว่าง\n` +
               `4. **"ตรวจความผิดปกติ"** - ตรวจจับ GPS และเวลาที่น่าสงสัย\n` +
               `5. **"ดูเรทราคา"** - อัตราค่าจ้างแต่ละประเภทงาน`;
    }

    // บันทึกเข้าประวัติแชท
    this.chatHistory.push({
      sender: 'user',
      text: question,
      time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
    });

    this.chatHistory.push({
      sender: 'ai',
      text: answer,
      time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
    });

    return answer;
  }
}

/** หน้าเข้าสู่ระบบ: เลือกบทบาท แล้วใช้บัญชีส่วนตัว */
class LoginView {
  constructor() {

  }

  render() {
    return `

              <input type="text" id="login-identifier" autocomplete="username" placeholder="เช่น 0656348605" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <p id="login-account-hint" class="mt-2 text-xs text-blue-300">ใช้เบอร์โทร 10 หลักหรือรหัสพนักงานของตนเอง</p>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">3. รหัส PIN</label>
              <input type="password" id="login-pin" maxlength="4" inputmode="numeric" autocomplete="current-password" placeholder="••••" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-center text-xl font-bold tracking-widest text-blue-400 focus:ring-2 focus:ring-blue-500 focus:outline-none" onkeydown="if(event.key==='Enter') loginView.handleLogin()">
            </div>

            <button id="login-button" onclick="loginView.handleLogin()" class="w-full py-4 bg-blue-500 hover:bg-blue-400 text-slate-950 text-lg font-black rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
              <i data-lucide="log-in" class="w-5 h-5"></i> เข้าสู่ระบบ
            </button>
            <p id="login-error" class="hidden text-sm text-red-300 bg-red-950/40 border border-red-900 rounded-xl p-3"></p>
          </div>

          <div class="bg-slate-950 p-4 text-center border-t border-slate-800">
            <p class="text-xs text-slate-500">หลังเข้าสู่ระบบ พนักงานขับรถจึงเลือกประเภทรถและหมายเลขรถ</p>
          </div>
        </div>
      </div>`;
  }

  roleButton(role, icon, label) {
    const active = this.selectedRole === role;
    return `<button data-role="${role}" onclick="loginView.selectRole('${role}')" class="role-button min-h-20 p-2 rounded-xl border text-xs font-bold transition ${active ? 'bg-blue-500 border-blue-400 text-slate-950' : 'bg-slate-900 border-slate-700 text-slate-300'}"><span class="block text-2xl mb-1">${icon}</span>${label}</button>`;
  }

  selectRole(role) {
    this.selectedRole = role;
    document.querySelectorAll('.role-button').forEach(button => {
      const active = button.dataset.role === role;
      button.className = `role-button min-h-20 p-2 rounded-xl border text-xs font-bold transition ${active ? 'bg-blue-500 border-blue-400 text-slate-950' : 'bg-slate-900 border-slate-700 text-slate-300'}`;
    });
    document.getElementById('login-error')?.classList.add('hidden');
    const identifier = document.getElementById('login-identifier');
    const hint = document.getElementById('login-account-hint');
    if (role === 'supervisor') {
      identifier.value = 'SUP_1';
      hint.textContent = 'บัญชีหัวหน้างาน: SUP_1';
    } else if (role === 'admin') {
      identifier.value = 'ADMIN_1';
      hint.textContent = 'บัญชีผู้บริหาร: ADMIN_1';
    } else {
      if (identifier.value === 'SUP_1' || identifier.value === 'ADMIN_1') identifier.value = '';
      hint.textContent = 'ใช้เบอร์โทร 10 หลักหรือรหัสพนักงานของตนเอง';
    }
  }

  async handleLogin() {
    const typedIdentifier = document.getElementById('login-identifier').value.trim();
    // มือถือบางรุ่นไม่คงค่าที่เติมด้วยสคริปต์ จึงกำหนดบัญชีตามบทบาทซ้ำตอนกดเข้าสู่ระบบ
    const identifier = typedIdentifier || (this.selectedRole === 'supervisor' ? 'SUP_1' : (this.selectedRole === 'admin' ? 'ADMIN_1' : ''));
    const pin = document.getElementById('login-pin').value;
    const errorBox = document.getElementById('login-error');
    if (!identifier || !pin) return this.showError('กรุณากรอกเบอร์โทรหรือรหัสพนักงาน และ PIN');
    this.setBusy(true);
    const result = await window.authService.login(identifier, pin, this.selectedRole);
    this.setBusy(false);
    if (!result.success) return this.showError(result.message);
    errorBox.classList.add('hidden');
    window.app.route();
  }

  showError(message) {
    const box = document.getElementById('login-error');
    box.textContent = message;
    box.classList.remove('hidden');
  }

  setBusy(busy) {
    const button = document.getElementById('login-button');
    button.disabled = busy;
    button.classList.toggle('opacity-60', busy);
    button.innerHTML = busy ? '<span class="inline-block w-5 h-5 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span> กำลังตรวจสอบ...' : '<i data-lucide="log-in" class="w-5 h-5"></i> เข้าสู่ระบบ';
    if (window.lucide) lucide.createIcons();
  }
}

        <!-- Main Action Zone (Work Card) -->
        <div class="bg-slate-900 border-2 border-blue-500/40 rounded-3xl p-5 shadow-2xl space-y-4 relative overflow-hidden">
          
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div class="flex items-center gap-2">
              <span class="flex h-3 w-3 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-3 w-3 bg-blue-500"></span>
              </span>
              <h2 class="text-lg font-black text-white">บันทึกงาน: รอบที่ ${nextRoundNumber}</h2>
            </div>
            <span class="text-xs font-bold px-2.5 py-1 bg-blue-500 text-slate-950 rounded-full">
              กำลังปฏิบัติงาน
            </span>
          </div>

          <!-- Select Job Type (NO PRICE VISIBLE FOR DRIVER) -->
          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
              1. เลือกประเภทงานวิ่ง
            </label>
            <select id="driver-job-select" onchange="driverView.handleJobChange(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm font-semibold focus:ring-2 focus:ring-blue-500 focus:outline-none">
              ${rates.map((r, idx) => {
                const isSelected = (!this.activeJobId && idx === 0) || this.activeJobId === r.id ? 'selected' : '';
                return `<option value="${r.id}" ${isSelected}>
                  ${r.name}
                </option>`;
              }).join('')}
            </select>
          </div>

          <!-- Camera Steps Container -->
          <div class="grid grid-cols-2 gap-3 pt-2">
            
            <!-- Step 1: Loading Point Photo -->
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3 text-center space-y-2">
              <p class="text-xs font-bold text-blue-400">1. จุดรับหิน (ขึ้นของ)</p>
              ${this.loadPhoto ? `
                <div class="relative rounded-xl overflow-hidden border border-blue-500/50 shadow-md">
                  <img src="${this.loadPhoto}" class="w-full h-28 object-cover">
                  <span class="absolute bottom-1 right-1 bg-blue-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">✓ รับหินแล้ว</span>
                </div>
                <button onclick="driverView.captureLoadPhoto()" class="text-[11px] text-blue-400 underline font-bold">ถ่ายใหม่</button>
              ` : `
                <button onclick="driverView.captureLoadPhoto()" class="w-full h-28 bg-blue-950/40 hover:bg-blue-900/60 border-2 border-dashed border-blue-500/60 rounded-xl flex flex-col items-center justify-center gap-1 text-blue-400 active:scale-95 transition">
                  <i data-lucide="camera" class="w-8 h-8"></i>
                  <span class="text-xs font-black">📸 ถ่ายจุดรับหิน</span>
                  <span class="text-[10px] text-slate-400">กล้องสด + GPS</span>
                </button>
              `}
            </div>

            <!-- Step 2: Dumping Point Photo -->
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3 text-center space-y-2">
              <p class="text-xs font-bold text-emerald-400">2. จุดเทหิน (ส่งมอบ)</p>
              ${this.dumpPhoto ? `
                <div class="relative rounded-xl overflow-hidden border border-emerald-500/50 shadow-md">
                  <img src="${this.dumpPhoto}" class="w-full h-28 object-cover">
                  <span class="absolute bottom-1 right-1 bg-emerald-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded">✓ เทหินแล้ว</span>
                </div>
                <button onclick="driverView.captureDumpPhoto()" class="text-[11px] text-emerald-400 underline font-bold">ถ่ายใหม่</button>
              ` : `
                <button onclick="driverView.captureDumpPhoto()" class="w-full h-28 bg-emerald-950/40 hover:bg-emerald-900/60 border-2 border-dashed border-emerald-500/60 rounded-xl flex flex-col items-center justify-center gap-1 text-emerald-400 active:scale-95 transition">
                  <i data-lucide="camera" class="w-8 h-8"></i>
                  <span class="text-xs font-black">📸 ถ่ายจุดเทหิน</span>
                  <span class="text-[10px] text-slate-400">กล้องสด + GPS</span>
                </button>
              `}
            </div>

          </div>

          <!-- Big Finish Round Button -->
          <button onclick="driverView.handleCompleteRound()" ${this.isCompletingRound ? 'disabled' : ''} class="w-full py-4.5 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 active:scale-98 disabled:opacity-60 text-slate-950 text-xl font-black rounded-2xl shadow-xl transition-all flex items-center justify-center gap-2 mt-3">
            <i data-lucide="check-circle-2" class="w-7 h-7 text-slate-950"></i>
            <span>${this.isCompletingRound ? 'กำลังบันทึกงาน...' : `จบงานรอบที่ ${nextRoundNumber} (นับ 1 เที่ยว)`}</span>
          </button>

        </div>

        <!-- Collapsible Section: History & Date Range Filter -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <h3 class="font-black text-sm text-white flex items-center gap-1.5">
              <i data-lucide="calendar" class="w-4 h-4 text-blue-400"></i>
              ประวัติการวิ่งย้อนหลังของฉัน
            </h3>
            <span class="text-xs bg-slate-800 text-blue-400 font-bold px-2.5 py-1 rounded-lg">
              รวม ${historyTotalTrips} เที่ยว (฿${historyTotalAmount.toLocaleString()} บ.)
            </span>
          </div>

          <!-- Date Filter Controls -->
          <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[10px] text-slate-400 font-bold mb-1">ตั้งแต่วันที่</label>
                <input type="date" id="driver-filter-from" value="${this.historyFromDate}" onchange="driverView.setHistoryDateFilter(this.value, null)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white">
              </div>
              <div>
                <label class="block text-[10px] text-slate-400 font-bold mb-1">ถึงวันที่</label>
                <input type="date" id="driver-filter-to" value="${this.historyToDate}" onchange="driverView.setHistoryDateFilter(null, this.value)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-xs text-white">
              </div>
            </div>

            <!-- Quick Filter Preset Buttons -->
            <div class="flex items-center gap-1.5 pt-1">
              <button onclick="driverView.setQuickDateFilter('today')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-[10px] font-bold text-slate-300">วันนี้</button>
              <button onclick="driverView.setQuickDateFilter('7days')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-[10px] font-bold text-slate-300">7 วันล่าสุด</button>
              <button onclick="driverView.setQuickDateFilter('thisMonth')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-[10px] font-bold text-slate-300">เดือนนี้</button>
              <button onclick="driverView.setQuickDateFilter('all')" class="px-2 py-1 bg-slate-800 hover:bg-slate-700 rounded text-[10px] font-bold text-blue-400">ทั้งหมด</button>
            </div>
          </div>

          <!-- Trip List -->
          <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
            ${filteredHistory.length === 0 ? `
              <div class="text-center py-6 text-slate-500 text-xs">
                ไม่พบประวัติการวิ่งในช่วงเวลาที่เลือก
              </div>
            ` : filteredHistory.map(t => `
              <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                  <span class="w-7 h-7 rounded-lg bg-blue-500/20 text-blue-400 flex items-center justify-center font-black text-xs">
                    #${t.roundNumber}
                  </span>
                  <div>
                    <p class="font-bold text-xs text-white">${t.jobTypeName} <span class="text-[10px] text-slate-400 font-normal">(${t.truckPlate})</span></p>
                    <p class="text-[10px] text-slate-400">${t.timestamp || t.date}</p>
                  </div>
                </div>
                <div class="text-right">
                  <p class="font-black text-sm text-emerald-400">+฿${t.amount || 0}</p>
                  <span class="text-[10px] text-slate-400">สำเร็จ</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

      </div>
    `;
  }

  // ปรับเปลี่ยนรถระหว่างวัน
  promptSwitchTruck() {
    const trucks = window.quarryStore.getTrucks();
    const shift = window.authService.getShift();
    const truckListStr = trucks.map((t, idx) => `${idx + 1}. ${t.code} (${t.capacity_ton} ตัน)`).join('\n');
    
    const choice = prompt(`🚗 เปลี่ยนรถระหว่างวัน (ปัจจุบันขับ: ${shift.vehicleCode})\n\nระบุหมายเลขลำดับรถใหม่ที่ต้องการขับ:\n${truckListStr}`);
    if (!choice) return;

    const num = parseInt(choice);
    if (isNaN(num) || num < 1 || num > trucks.length) {
      alert("หมายเลขรถไม่ถูกต้อง");
      return;
    }

    const newTruck = trucks[num - 1];
    const reason = prompt("ระบุเหตุผลการเปลี่ยนรถสั้นๆ (เช่น รถเสีย / ยางแตก / ย้ายงาน):", "เปลี่ยนรถระหว่างวัน") || "เปลี่ยนรถ";
    
    // อัปเดต shift ปัจจุบัน
    shift.vehicleCode = newTruck.code;
    shift.capacityTon = newTruck.capacity_ton;
    localStorage.setItem(CONFIG.STORAGE_KEYS.CURRENT_SHIFT, JSON.stringify(shift));

    alert(`✅ เปลี่ยนเป็นรถ ${newTruck.code} (${newTruck.capacity_ton} ตัน) สำเร็จ!\nเหตุผล: ${reason}\nรอบวิ่งถัดไปจะบันทึกด้วยรถคันใหม่นี้`);
    window.app.render();
  }

  setHistoryDateFilter(from, to) {
    if (from !== null) this.historyFromDate = from;
    if (to !== null) this.historyToDate = to;
    window.app.render();
  }

  setQuickDateFilter(type) {
    const today = new Date().toISOString().split('T')[0];
    if (type === 'today') {
      this.historyFromDate = today;
      this.historyToDate = today;
    } else if (type === '7days') {
      const d = new Date();
      d.setDate(d.getDate() - 7);
      this.historyFromDate = d.toISOString().split('T')[0];
      this.historyToDate = today;
    } else if (type === 'thisMonth') {
      const d = new Date();
      this.historyFromDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
      this.historyToDate = today;
    } else {
      this.historyFromDate = '';
      this.historyToDate = '';
    }
    window.app.render();
  }

  handleStartShift() {
    const sel = document.getElementById('shift-truck-select');
    const vehicleCode = sel.value;
    const capacityTon = Number(sel.options[sel.selectedIndex].dataset.capacity || 30);
    window.authService.startShift(vehicleCode, capacityTon);
    window.app.render();
  }

  confirmEndShift() {
    if (confirm("⚠️ คุณต้องการ [ปิดกะประจำวัน] และสรุปยอดเที่ยวทั้งหมดของวันนี้ใช่หรือไม่?\n(หากแค่จะพักชั่วคราว ให้กดปุ่ม 'พัก/ออก' แทน)")) {
      window.authService.endShift();
      window.app.render();
    }
  }

  handleJobChange(jobId) {
    this.activeJobId = jobId;
  }

  async captureLoadPhoto() {
    const user = window.authService.getUser();
    const shift = window.authService.getShift();
    const todayTrips = window.quarryStore.getTrips({ driverPhone: user.phone, date: new Date().toISOString().split('T')[0] });
    const roundNumber = todayTrips.length + 1;

    try {
      const result = await window.cameraEngine.captureWithWatermark({
        stepType: 'load',
        vehicleCode: shift.vehicleCode,
        capacity: shift.capacityTon,
        driverName: user.name,
        roundNumber: roundNumber,
        jobName: document.getElementById('driver-job-select')?.selectedOptions[0]?.text.trim() || 'รับหิน'
      });

      this.loadPhoto = result.photoBase64;
      this.loadGPS = result.gps;
      window.app.render();
    } catch (err) {
      if (err.message !== "ยกเลิกการถ่ายรูป") {
        alert("เกิดข้อผิดพลาดในการถ่ายภาพ: " + err.message);
      }
    }
  }

  async captureDumpPhoto() {
    const user = window.authService.getUser();
    const shift = window.authService.getShift();
    const todayTrips = window.quarryStore.getTrips({ driverPhone: user.phone, date: new Date().toISOString().split('T')[0] });
    const roundNumber = todayTrips.length + 1;

    try {
      const result = await window.cameraEngine.captureWithWatermark({
        stepType: 'dump',
        vehicleCode: shift.vehicleCode,
        capacity: shift.capacityTon,
        driverName: user.name,
        roundNumber: roundNumber,
        jobName: document.getElementById('driver-job-select')?.selectedOptions[0]?.text.trim() || 'เทหิน'
      });

      this.dumpPhoto = result.photoBase64;
      this.dumpGPS = result.gps;
      window.app.render();
    } catch (err) {
      if (err.message !== "ยกเลิกการถ่ายรูป") {
        alert("เกิดข้อผิดพลาดในการถ่ายภาพ: " + err.message);
      }
    }
  }

  handleCompleteRound() {
    if (this.isCompletingRound) return;
    if (!this.loadPhoto) {
      alert("⚠️ กรุณากดถ่ายรูป [จุดรับหิน] ก่อนครับ");
      return;
    }
    if (!this.dumpPhoto) {
      alert("⚠️ กรุณากดถ่ายรูป [จุดเทหิน] ก่อนครับ");
      return;
    }

    const user = window.authService.getUser();
    const shift = window.authService.getShift();
    const today = new Date().toISOString().split('T')[0];
    const todayTrips = window.quarryStore.getTrips({ driverPhone: user.phone, date: today });
    const roundNumber = todayTrips.length + 1;

    const jobSelect = document.getElementById('driver-job-select');
    const jobId = jobSelect ? jobSelect.value : (this.activeJobId || 'R1');
    const jobRates = window.quarryStore.getJobRates();
    const jobObj = jobRates.find(r => r.id === jobId) || jobRates[0];
    if (!jobObj) {
      alert('ยังไม่พบประเภทงานวิ่ง กรุณารีเฟรชระบบแล้วลองใหม่');
      return;
    }
    this.isCompletingRound = true;
    const amount = window.quarryStore.calculateTruckRate(jobObj.id, shift.capacityTon);

    const tripRecord = {
      id: 'TRIP_' + Date.now(),
      date: today,
      timestamp: new Date().toLocaleString('th-TH'),
      driverId: user.id,
      driverName: user.name,
      driverPhone: user.phone,
      truckPlate: shift.vehicleCode,
      capacityTon: shift.capacityTon,
      roundNumber: roundNumber,
      jobTypeId: jobObj.id,
      jobTypeName: jobObj.name,
      amount: amount,
      loadPhotoBase64: this.loadPhoto,
      loadLat: this.loadGPS && this.loadGPS.isAvailable ? this.loadGPS.lat : '',
      loadLng: this.loadGPS && this.loadGPS.isAvailable ? this.loadGPS.lng : '',
      dumpPhotoBase64: this.dumpPhoto,
      dumpLat: this.dumpGPS && this.dumpGPS.isAvailable ? this.dumpGPS.lat : '',
      dumpLng: this.dumpGPS && this.dumpGPS.isAvailable ? this.dumpGPS.lng : ''
    };

    // รีเซ็ตก่อนแจ้งซิงก์ เพื่อให้หน้าจอพร้อมสำหรับรอบถัดไปเสมอ
    this.loadPhoto = null;
    this.loadGPS = null;
    this.dumpPhoto = null;
    this.dumpGPS = null;
    this.activeJobId = null;

    try {
      window.quarryStore.saveTrip(tripRecord);
      this.isCompletingRound = false;
      window.app.render();
      alert(`🎉 บันทึกรอบที่ ${roundNumber} สำเร็จ!\nพร้อมเริ่มรอบที่ ${roundNumber + 1} ได้ทันที`);
    } catch (err) {
      this.isCompletingRound = false;
      window.app.render();
      alert('บันทึกรอบไม่สำเร็จ: ' + (err.message || err));
    }
  }
}

window.driverView = new DriverView();

</script>
  <script>
/**
 * หน้าจอสำหรับคนขับรถขุด / แม็คโคร (Excavator Operator PWA Flow)
 * รองรับ: เปิดกะเลือกรถ, สลับแม็คโครระหว่างวัน, แยก Logout/ปิดกะ, กรองประวัติย้อนหลัง
 */
class ExcavatorView {
  constructor() {
    this.selectedShiftExcavator = localStorage.getItem('quarry_excavator_shift') || null;
    this.scoopPhoto = null;
    this.scoopGPS = null;

    // Filter สำหรับดูประวัติย้อนหลัง
    this.historyFromDate = '';
    this.historyToDate = '';
  }

  render() {
    const user = window.authService.getUser();
    if (!this.selectedShiftExcavator) {
      return this.renderShiftSelect(user);
    }
    return this.renderActiveCockpit(user);
  }

  // 1. หน้าจอเปิดกะและเลือกรถขุด
  renderShiftSelect(user) {
    const excavators = window.quarryStore.getExcavators();

    return `
      <div class="min-h-screen bg-slate-950 text-white p-4 pb-20 max-w-lg mx-auto">
        
        <!-- Top Bar -->
        <div class="flex items-center justify-between py-3 border-b border-slate-800 mb-6">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-blue-600 text-slate-950 flex items-center justify-center font-black text-lg">
              🚜
            </div>
            <div>
              <h2 class="font-bold text-base text-white">${user.name}</h2>
              <p class="text-xs text-blue-400 font-medium">คนขับรถขุด / แม็คโครประจำโรงโม่</p>
            </div>
          </div>
          <button onclick="window.app.logout()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg text-slate-300 flex items-center gap-1">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i> ออกจากระบบ
          </button>
        </div>

        <!-- Shift Start Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-5">
          <div class="text-center space-y-2">
            <span class="text-4xl">🚜</span>
            <h1 class="text-xl font-black text-white">เปิดกะการทำงานประจำวัน</h1>
            <p class="text-sm text-slate-400">เลือกรถขุด/แม็คโครที่คุณจะประจำการในวันนี้</p>
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">
              เลือกรถแม็คโคร (ทั้งหมด 20 คัน)
            </label>
            <select id="shift-excavator-select" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3.5 text-white text-base focus:ring-2 focus:ring-blue-500 focus:outline-none">
              ${excavators.map(e => `
                <option value="${e.code}">
                  ${e.code} ${e.is_contractor ? '[ทีม ผรม.]' : ''} ${e.status === 'repair' ? '⚠️ [ซ่อม]' : ''}
                </option>
              `).join('')}
            </select>
          </div>

          <button onclick="excavatorView.handleStartShift()" class="w-full py-4 bg-blue-500 hover:bg-blue-400 active:scale-98 text-slate-950 text-lg font-black rounded-xl shadow-lg transition flex items-center justify-center gap-2">
            <i data-lucide="play" class="w-6 h-6"></i>
            เปิดงานประจำวัน
          </button>
        </div>

      </div>
    `;
  }

  // 2. หน้าจอห้องควบคุมคนขับแม็คโคร
  renderActiveCockpit(user) {
    const excavators = window.quarryStore.getExcavators();
    const trucks = window.quarryStore.getTrucks();
    const currentExcObj = excavators.find(e => e.code === this.selectedShiftExcavator) || { code: this.selectedShiftExcavator, rate_per_scoop: 5.0 };
    
    const today = new Date().toISOString().split('T')[0];
    const allMyLogs = window.quarryStore.getExcavatorLogs({ operatorName: user.name });
    const todayLogs = allMyLogs.filter(l => l.date === today);
    const defaultRate = currentExcObj.rate_per_scoop || 5.0;
    const totalEarningsToday = todayLogs.reduce((sum, l) => sum + (l.amount || defaultRate), 0);

    // กรองประวัติย้อนหลัง
    let filteredHistory = allMyLogs.filter(l => {
      if (this.historyFromDate && l.date < this.historyFromDate) return false;
      if (this.historyToDate && l.date > this.historyToDate) return false;
      return true;
    });

    const historyTotalScoops = filteredHistory.length;
    const historyTotalAmount = filteredHistory.reduce((sum, l) => sum + (l.amount || defaultRate), 0);

    return `
      <div class="min-h-screen bg-slate-950 text-white p-3 pb-24 max-w-lg mx-auto space-y-4">
        
        <!-- Header -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl bg-blue-600 text-slate-950 flex items-center justify-center font-black text-2xl shadow-inner">
                🚜
              </div>

    window.app.render();
  }

  promptSwitchExcavator() {
    const excavators = window.quarryStore.getExcavators();
    const excListStr = excavators.map((e, idx) => `${idx + 1}. ${e.code} ${e.is_contractor ? '(ผรม.)' : ''}`).join('\n');
    
    const choice = prompt(`🚜 เปลี่ยนรถขุด/แม็คโครระหว่างวัน (ปัจจุบัน: ${this.selectedShiftExcavator})\n\nระบุหมายเลขลำดับรถแม็คโครใหม่ที่ต้องการประจำการ:\n${excListStr}`);
    if (!choice) return;

    const num = parseInt(choice);
    if (isNaN(num) || num < 1 || num > excavators.length) {
      alert("หมายเลขรถไม่ถูกต้อง");
      return;
    }

    const newExc = excavators[num - 1];
    this.selectedShiftExcavator = newExc.code;
    localStorage.setItem('quarry_excavator_shift', this.selectedShiftExcavator);

    alert(`✅ เปลี่ยนเป็นแม็คโคร ${newExc.code} สำเร็จ!\nรายการตักถัดไปจะบันทึกด้วยเครื่องจักรนี้`);
    window.app.render();
  }

  setHistoryDateFilter(from, to) {
    if (from !== null) this.historyFromDate = from;
    if (to !== null) this.historyToDate = to;
    window.app.render();
  }

  setQuickDateFilter(type) {
    const today = new Date().toISOString().split('T')[0];
    if (type === 'today') {
      this.historyFromDate = today;
      this.historyToDate = today;
    } else if (type === '7days') {
      const d = new Date();
      d.setDate(d.getDate() - 7);
      this.historyFromDate = d.toISOString().split('T')[0];
      this.historyToDate = today;
    } else if (type === 'thisMonth') {
      const d = new Date();
      this.historyFromDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
      this.historyToDate = today;
    } else {
      this.historyFromDate = '';
      this.historyToDate = '';
    }
    window.app.render();
  }

  confirmEndShift() {
    if (confirm("⚠️ คุณต้องการ [ปิดกะประจำวัน] และสรุปยอดการตักทั้งหมดของวันนี้ใช่หรือไม่?\n(หากแค่จะพักชั่วคราว ให้กดปุ่ม 'พัก/ออก' แทน)")) {
      this.selectedShiftExcavator = null;
      localStorage.removeItem('quarry_excavator_shift');
      window.app.render();
    }
  }

  async captureScoopPhoto() {
    const user = window.authService.getUser();
    const truckSelect = document.getElementById('target-truck-select');
    const targetTruck = truckSelect ? truckSelect.value : 'TRUCK';

    try {
      const result = await window.cameraEngine.captureWithWatermark({
        stepType: 'excavator',
        vehicleCode: this.selectedShiftExcavator,
        driverName: user.name,
        jobName: `ตักให้ ${targetTruck}`
      });

      this.scoopPhoto = result.photoBase64;
      this.scoopGPS = result.gps;
      window.app.render();
    } catch (err) {
      if (err.message !== "ยกเลิกการถ่ายรูป") {
        alert("เกิดข้อผิดพลาด: " + err.message);
      }
    }
  }

  handleSaveScoopLog() {
    if (!this.scoopPhoto) {
      alert("⚠️ กรุณากดถ่ายรูปยืนยันขณะตักหินก่อนครับ");
      return;
    }

    const user = window.authService.getUser();
    const excavators = window.quarryStore.getExcavators();
    const currentExc = excavators.find(e => e.code === this.selectedShiftExcavator) || {};
    const truckSelect = document.getElementById('target-truck-select');
    const targetTruck = truckSelect ? truckSelect.value : 'TRUCK';
    const rate = currentExc.rate_per_scoop || 5.0;

    const logRecord = {
      id: 'EXC_' + Date.now(),
      date: new Date().toISOString().split('T')[0],
      timestamp: new Date().toLocaleString('th-TH'),
      operatorName: user.name,
      operatorPhone: user.phone,
      excavatorCode: this.selectedShiftExcavator,
      targetTruckPlate: targetTruck,
      amount: rate,
      photoBase64: this.scoopPhoto,
      lat: this.scoopGPS ? this.scoopGPS.lat : 14.8824,
      lng: this.scoopGPS ? this.scoopGPS.lng : 102.0135
    };

    window.quarryStore.saveExcavatorLog(logRecord);

    this.scoopPhoto = null;
    this.scoopGPS = null;

    alert(`🎉 บันทึกการตักให้รถ ${targetTruck} สำเร็จ!\nได้เงินเพิ่ม: +${rate} บาท`);
    window.app.render();
  }
}

window.excavatorView = new ExcavatorView();

</script>

  openTruckDetail(code) {
    const truck = window.quarryStore.getTrucks().find(t => t.code === code);
    if (!truck) return;
    const allTrips = window.quarryStore.getTrips({ truckPlate: code });
    const today = new Date().toISOString().split('T')[0];
    const todayTrips = allTrips.filter(t => t.date === today);
    const totalToday = todayTrips.reduce((sum, t) => sum + Number(t.amount || 0), 0);
    const totalAll = allTrips.reduce((sum, t) => sum + Number(t.amount || 0), 0);
    const recent = allTrips.slice(0, 12);
    this.showVehicleModal(
      `🚚 ${truck.code}`,
      `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
          ${this.detailMetric('สถานะวันนี้', todayTrips.length ? '🟢 กำลังวิ่ง' : '⚪ จอด', todayTrips.length ? 'text-emerald-400' : 'text-slate-300')}
          ${this.detailMetric('พิกัดรถ', `${truck.capacity_ton || 0} ตัน`, 'text-blue-400')}
          ${this.detailMetric('เที่ยววันนี้', `${todayTrips.length} เที่ยว`, 'text-white')}
          ${this.detailMetric('รายได้วันนี้', `฿${totalToday.toLocaleString()}`, 'text-emerald-400')}
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-5 text-sm">
          <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4"><p class="text-xs text-slate-500">คนขับประจำ</p><p class="font-bold text-white mt-1">${truck.driver_name || 'ยังไม่กำหนด'}</p><p class="text-xs text-blue-300 mt-1">ชื่อเรียก: ${truck.nickname || '-'}</p></div>
          <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4"><p class="text-xs text-slate-500">ข้อมูลติดต่อและยอดสะสม</p><p class="font-bold text-white mt-1">${truck.phone || '-'}</p><p class="text-xs text-emerald-400 mt-1">ทั้งหมด ${allTrips.length} เที่ยว • ฿${totalAll.toLocaleString()}</p></div>
        </div>
        ${this.renderTruckHistory(recent)}
      `
    );
  }

  openExcavatorDetail(code) {
    const excavator = window.quarryStore.getExcavators().find(e => e.code === code);
    if (!excavator) return;
    const allLogs = window.quarryStore.getExcavatorLogs({ excavatorCode: code });
    const today = new Date().toISOString().split('T')[0];
    const todayLogs = allLogs.filter(l => l.date === today);
    const totalToday = todayLogs.reduce((sum, l) => sum + Number(l.amount || excavator.rate_per_scoop || 0), 0);
    const totalAll = allLogs.reduce((sum, l) => sum + Number(l.amount || excavator.rate_per_scoop || 0), 0);
    this.showVehicleModal(
      `🚜 ${excavator.code}`,
      `
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
          ${this.detailMetric('สถานะ', excavator.status === 'repair' ? '🔴 ซ่อม' : (todayLogs.length ? '🟢 ทำงาน' : '⚪ ว่าง'), excavator.status === 'repair' ? 'text-red-400' : 'text-emerald-400')}
          ${this.detailMetric('ตักวันนี้', `${todayLogs.length} คัน`, 'text-blue-400')}
          ${this.detailMetric('เรทต่อตัก', `฿${excavator.rate_per_scoop || 0}`, 'text-white')}
          ${this.detailMetric('รายได้วันนี้', `฿${totalToday.toLocaleString()}`, 'text-emerald-400')}
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-5 text-sm">
          <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4"><p class="text-xs text-slate-500">ผู้ควบคุมประจำ</p><p class="font-bold text-white mt-1">${excavator.driver_name || 'ยังไม่กำหนด'}</p><p class="text-xs text-blue-300 mt-1">ชื่อเรียก: ${excavator.nickname || '-'}</p></div>
          <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4"><p class="text-xs text-slate-500">ข้อมูลเพิ่มเติม</p><p class="font-bold text-white mt-1">${excavator.phone || '-'}</p><p class="text-xs text-emerald-400 mt-1">${excavator.is_contractor ? 'ทีมผู้รับเหมา' : 'ทีมประจำ'} • รวม ${allLogs.length} งาน • ฿${totalAll.toLocaleString()}</p></div>
        </div>
        ${this.renderExcavatorHistory(allLogs.slice(0, 12))}
      `
    );
  }

  detailMetric(label, value, colorClass) {
    return `<div class="bg-slate-950 border border-slate-800 rounded-2xl p-3"><p class="text-[10px] text-slate-500 font-bold">${label}</p><p class="font-black ${colorClass} mt-1">${value}</p></div>`;
  }

  renderTruckHistory(items) {
    if (!items.length) return '<div class="text-center py-8 text-slate-500 text-sm bg-slate-950 rounded-2xl border border-slate-800">ยังไม่มีประวัติงานของรถคันนี้</div>';
    return `<div><h4 class="font-black text-white mb-3">ประวัติเที่ยวล่าสุด</h4><div class="space-y-2">${items.map(t => `<div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between gap-3"><div><p class="text-sm font-bold text-white">รอบ ${t.roundNumber || '-'} • ${t.jobTypeName || '-'}</p><p class="text-[11px] text-slate-400">${t.date || ''} ${t.timestamp || ''} • ${t.driverName || '-'}</p></div><p class="font-black text-emerald-400">฿${Number(t.amount || 0).toLocaleString()}</p></div>`).join('')}</div></div>`;
  }

  renderExcavatorHistory(items) {
    if (!items.length) return '<div class="text-center py-8 text-slate-500 text-sm bg-slate-950 rounded-2xl border border-slate-800">ยังไม่มีประวัติงานของรถคันนี้</div>';
    return `<div><h4 class="font-black text-white mb-3">ประวัติงานล่าสุด</h4><div class="space-y-2">${items.map(l => `<div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between gap-3"><div><p class="text-sm font-bold text-white">ตักให้รถ ${l.targetTruckPlate || '-'}</p><p class="text-[11px] text-slate-400">${l.date || ''} ${l.timestamp || ''} • ${l.operatorName || '-'}</p></div><p class="font-black text-emerald-400">฿${Number(l.amount || 0).toLocaleString()}</p></div>`).join('')}</div></div>`;
  }

  showVehicleModal(titleText, contentHtml) {
    const modal = document.getElementById('vehicle-detail-modal');
    const title = document.getElementById('vehicle-detail-title');
    const content = document.getElementById('vehicle-detail-content');
    if (!modal || !title || !content) return;
    title.textContent = titleText;
    content.innerHTML = contentHtml;
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }

  closeVehicleModal() {
    const modal = document.getElementById('vehicle-detail-modal');
    if (modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); }
  }

  viewPhoto(photoBase64, type, vehicle, timestamp) {

  handleFilterChange() {
    this.filterDateFrom = document.getElementById('filter-date-from')?.value || '';
    this.filterDateTo = document.getElementById('filter-date-to')?.value || '';
    this.filterVehicle = document.getElementById('filter-vehicle')?.value || '';
    this.filterDriver = document.getElementById('filter-driver')?.value || '';
    window.app.render();
  }

  handleDateFrom(v) {
    this.filterDateFrom = v;
    window.app.render();
  }

  handleDateTo(v) {
    this.filterDateTo = v;
    window.app.render();
  }

  setQuickDateFilter(type) {
    const today = new Date().toISOString().split('T')[0];
    if (type === 'today') {
      this.filterDateFrom = today;
      this.filterDateTo = today;
    } else if (type === '7days') {
      const d = new Date();
      d.setDate(d.getDate() - 7);
      this.filterDateFrom = d.toISOString().split('T')[0];
      this.filterDateTo = today;
    } else if (type === 'thisMonth') {
      const d = new Date();
      this.filterDateFrom = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`;
      this.filterDateTo = today;
    } else {
      this.filterDateFrom = '';
      this.filterDateTo = '';
    }
    window.app.render();
  }

  exportToExcel() {
    const trips = window.quarryStore.getTrips();
    const excLogs = window.quarryStore.getExcavatorLogs();
    
    // Sheet 1: Detailed Trips
    const tripsRows = trips.map((t, idx) => ({
      "ลำดับ": idx + 1,
      "รหัสรอบ (Trip ID)": t.id,
      "วันที่-เวลา": t.timestamp,
      "เบอร์รถ/ทะเบียน": t.truckPlate,
      "ขนาดพิกัด (ตัน)": t.capacityTon,
      "ชื่อคนขับ": t.driverName,
      "เบอร์โทรศัพท์": t.driverPhone,
      "ประเภทงานวิ่ง": t.jobTypeName,
      "รอบที่": t.roundNumber,
      "ยอดเงิน (บาท)": t.amount,
      "พิกัดรับหิน (Lat,Lng)": `${t.loadLat || ''}, ${t.loadLng || ''}`,
      "พิกัดเทหิน (Lat,Lng)": `${t.dumpLat || ''}, ${t.dumpLng || ''}`
    }));

    // Sheet 2: Excavator Logs
    const excRows = excLogs.map((l, idx) => ({
      "ลำดับ": idx + 1,
      "รหัสตัก (Log ID)": l.id,
      "วันที่-เวลา": l.timestamp,
      "เบอร์แม็คโคร": l.excavatorCode,
      "ผู้ควบคุม": l.operatorName,
      "รถบรรทุกที่รับหิน": l.targetTruckPlate,
      "ยอดเงิน (บาท)": l.amount,
      "พิกัด (Lat,Lng)": `${l.lat || ''}, ${l.lng || ''}`
    }));

    // Generate workbook
    const wb = XLSX.utils.book_new();
    const wsTrips = XLSX.utils.json_to_sheet(tripsRows);
    const wsExc = XLSX.utils.json_to_sheet(excRows);

    XLSX.utils.book_append_sheet(wb, wsTrips, "รอบวิ่งรถบรรทุก");
    XLSX.utils.book_append_sheet(wb, wsExc, "รายการตักแม็คโคร");

    const fileName = `รายงานโรงโม่_${new Date().toISOString().split('T')[0]}.xlsx`;
    XLSX.writeFile(wb, fileName);
  }
}

window.reportsView = new ReportsView();

</script>
